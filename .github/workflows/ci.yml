name: CI Quality Gates

on:
  push:
    branches: [main, "m*-*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_owner
          POSTGRES_PASSWORD: lms_dev_password
          POSTGRES_DB: lms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: 1. Lint
        run: npm run lint

      - name: 2. Typecheck
        run: npm run typecheck

      - name: 3. Unit & Authorization Tests
        run: npm test

      - name: 4. Production Build
        run: npm run build
